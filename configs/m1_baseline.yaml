# M1 Max baseline config — DiLoCo with GPT-Neo (no compression)
# ~10M params, fits comfortably in 32GB RAM with 2 gloo workers
model: "gpt-neo"
dataset: "c4"

local_steps: 50
lr: 4e-4
outer_lr: 0.7
warmup_steps: 100
total_steps: 2000

per_device_train_batch_size: 8
batch_size: 16

optim_method: "sgd"

checkpoint_path: "checkpoints/m1_baseline.pth"
checkpoint_interval: 200

device: "cpu"
pgroup_backend: "gloo"

wandb_project_name: "diloco-lattice-compression"
wandb_group: "m1-baseline"
experiment_description: "Baseline DiLoCo on M1 Max — no compression"
experiment_tags:
  - "baseline"
  - "gpt-neo"
  - "c4"
  - "m1"
  - "no-compression"
seed: 42
wandb_logging: true

compression_method: "none"
heterogeneous: false
hf_upload: false
